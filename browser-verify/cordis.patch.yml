# Browser Verification: one MCP client row + one Host half.
#
# The MCP server is resolved with npx so the bundle is portable. On Windows the
# executable is cmd.exe; every other platform calls npx directly. Each JS expression
# is a quoted string so YAML keeps it as one scalar.
#
# failOnStartupError is false: the first npx run downloads chrome-devtools-mcp and
# can take a minute; the client reconnects until the tools appear.
- insert:
    - id: browser-verify
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browser
        transport: stdio
        command: !!js "process.platform === 'win32' ? 'cmd' : 'npx'"
        args: !!js "process.platform === 'win32' ? ['/c', 'npx', '-y', 'chrome-devtools-mcp@latest', '--headless', '--isolated', '--no-usage-statistics'] : ['-y', 'chrome-devtools-mcp@latest', '--headless', '--isolated', '--no-usage-statistics']"
        env:
          CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS: '1'
          CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 120000
    - id: browser-verify-auth
      name: 'dsh-plugin-browser-verify'
